name = "edutrack"
main = "src/index.js"
compatibility_date = "2026-10-30"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
COLLEGE_TIMEZONE = "Asia/Kolkata"

[[d1_databases]]
binding = "DB"
database_name = "college-attendance"
database_id = "24ad4cea-0fdb-4c38-9e0d-0fd762854b63"
migrations_dir = "./migrations"

[observability]
enabled = true
