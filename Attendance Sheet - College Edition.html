<header class="top"><div class="wrap"><div class="brand"><span class="logo" aria-hidden="true">🎓</span><div><h1 id="hCollege">IMPACT College of Engineering and Management</h1><p id="hTag">Attendance Sheet</p></div></div><button class="ic" data-act="theme" aria-label="Change theme">◐</button></div></header>

<script>
const $=s=>document.querySelector(s),K='impact-attendance-session-v2',uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const byRoll=(a,b)=>a.roll.localeCompare(b.roll,undefined,{numeric:true});
const DEF={settings:{college:'',tagline:'Attendance Sheet',dept:'',accent:'#007aff',theme:'auto',size:100,min:75,late:true,labels:{P:'Present',A:'Absent',L:'Late',E:'Leave'}},classes:[],depts:[],active:''};
const KEYS=['P','A','L','E'];
function norm(r){const d=JSON.parse(JSON.stringify(DEF));if(r&&Array.isArray(r.classes)){d.classes=r.classes.map(c=>({id:c.id||uid(),name:c.name||'Class',sub:c.sub||'',dept:c.dept||'',teacher:c.teacher||'',routine:Array.isArray(c.routine)?c.routine:[],students:(c.students||[]).map(s=>({id:s.id||uid(),roll:String(s.roll==null?'':s.roll),name:String(s.name||''),dept:String(s.dept||'')})),records:c.records||{}}));d.active=r.active;const s=r.settings||{};Object.assign(d.settings,s);delete d.settings.teacher;d.settings.labels=Object.assign({},DEF.settings.labels,s.labels||{});d.depts=[...new Set([...(Array.isArray(r.depts)?r.depts:[]),s.dept,...d.classes.flatMap(c=>[c.dept,...c.students.map(x=>x.dept)])].filter(Boolean))].sort((a,b)=>a.localeCompare(b))}return d}
let S;try{S=norm(JSON.parse(sessionStorage.getItem(K)))}catch(e){S=norm(null)}
let view='attendance',date=iso(new Date()),lastToday=date,q='',rf='',rt='',sort='roll',df='',tt,midnightTimer;
const C=()=>S.classes.find(c=>c.id===S.active)||S.classes[0];
function save(){try{sessionStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Browser storage is blocked. Export a backup to keep your data.')}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
function skin(){const s=S.settings,r=document.documentElement,name=s.college||'Your College';s.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',s.theme);r.style.setProperty('--ac',s.accent);r.style.fontSize=s.size+'%';$('#hCollege').textContent=name;$('#hTag').textContent=s.tagline;document.title=s.tagline+' – '+name;$('meta[name=theme-color]').content=s.accent;const desc=`${s.tagline} for ${name}: manage classes, mark student attendance and view reports.`;$('meta[name=description]').content=desc;$('meta[property="og:title"]').content=document.title;$('meta[property="og:description"]').content=desc;$('#structuredData').textContent=JSON.stringify({'@context':'https://schema.org','@type':'WebApplication',name:document.title,applicationCategory:'EducationalApplication',operatingSystem:'Any',description:desc,offers:{'@type':'Offer',price:'0',priceCurrency:'INR'}})}
const close=()=>{$('#ov').hidden=true;$('#ov').innerHTML=''};
function sheet(o){const ov=$('#ov');ov.hidden=false;ov.innerHTML=`<form class="sh" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><h3>${esc(o.title)}</h3>${o.msg?`<p class="muted">${o.msg}</p>`:''}${(o.fields||[]).map(f=>`<label>${f.l}${f.area?`<textarea name="${f.k}" rows="8" placeholder="${esc(f.ph)}"></textarea>`:f.options?`<select name="${f.k}">${f.options.map(v=>`<option${v===f.v?' selected':''}>${esc(v)}</option>`).join('')}</select>`:f.dl?`<select name="${f.k}">${dOpts(f.v,f.none||'None')}</select>`:`<input type="${f.type||'text'}" name="${f.k}" value="${esc(f.v)}" placeholder="${esc(f.ph)}" ${f.req?'required':''} ${f.dl?'list="deps"':''}>`}</label>`).join('')}<div class="acts end"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn ${o.danger?'dng2':'pri'}">${o.ok||'Save'}</button></div></form>`;const fm=ov.firstChild;fm.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(fm));close();o.run(d)};const i=fm.querySelector('input,textarea,select');if(i)i.focus()}
function stats(c,from,to){const dates=Object.keys(c.records).filter(d=>Object.keys(c.records[d]).length&&(!from||d>=from)&&(!to||d<=to)).sort();
const rows=c.students.map(s=>{const n={P:0,A:0,L:0,E:0};dates.forEach(d=>{const v=c.records[d][s.id];if(v)n[v]++});const den=n.P+n.A+n.L,att=n.P+(S.settings.late?n.L:0);return{s,n,pct:den?Math.round(att/den*1000)/10:null}});return{dates,rows}}
const pick=()=>`<label>Class<select data-ch="cls">${S.classes.map(c=>`<option value="${c.id}"${c.id===C().id?' selected':''}>${esc([c.name,c.sub,c.dept].filter(Boolean).join(' – '))}</option>`).join('')}</select></label>`;
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const hue=n=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return h};
const who=(s,c)=>`<div class="who"><span class="av" style="background:hsl(${hue(s.name)} 55% 46%)">${esc(ini(s.name))}</span><span class="nm">${esc(s.name)}<small>Roll ${esc(s.roll)}${(s.dept||c.dept)?' – '+esc(s.dept||c.dept):''}</small></span></div>`;
const dOpts=(v,none='None')=>`<option value="">${none}</option>`+S.depts.map(d=>`<option${d===v?' selected':''}>${esc(d)}</option>`).join('');
const slider=c=>S.depts.length?`<div class="slider" aria-label="Filter by department">${['',...S.depts].map(d=>`<button class="pill${df===d?' on':''}" data-act="filt" data-dep="${esc(d)}">${d?esc(d):'All'}<i>${c.students.filter(s=>!d||(s.dept||c.dept)===d).length}</i></button>`).join('')}</div>`:'';
const empty=t=>`<section class="card empty"><div style="font-size:2.4rem" aria-hidden="true">📋</div><h2>${t}</h2><p>Create your first class to start marking attendance.</p><button class="btn pri" data-act="newClass">New class</button></section>`;
function vAtt(){if(!C())return empty('Welcome, teacher');return `<section><h2>Mark attendance</h2><div class="card hero"><div class="logo" aria-hidden="true">${esc(ini(C().name))}</div><div><h3>${esc(C().name)}</h3><p>${esc([C().dept,C().sub].filter(Boolean).join(' – ')||'No department set')}${C().teacher?' · Teacher: '+esc(C().teacher):''}</p></div><span class="badge" style="margin-left:auto">${esc(fmt(date))}</span></div><div class="card bar">${pick()}<label>Date<div class="dt"><button class="ic" data-act="day" data-d="-1" aria-label="Previous day">‹</button><input type="date" id="date" value="${date}"><button class="ic" data-act="day" data-d="1" aria-label="Next day">›</button></div></label></div><div class="tools"><input type="search" id="q" placeholder="Search name or roll no." aria-label="Search students" value="${esc(q)}"><button class="btn" data-act="all">Mark all ${esc(S.settings.labels.P)}</button><button class="btn dng" data-act="clear">Clear day</button></div>${slider(C())}<div id="sum" class="sum"></div><div class="prog" aria-hidden="true"><i id="pg"></i></div><div id="list" class="card list"></div></section>`}
function list(){const c=C(),day=c.records[date]||{},qq=q.toLowerCase(),L=S.settings.labels,n={P:0,A:0,L:0,E:0,U:0};c.students.forEach(s=>n[day[s.id]||'U']++);
$('#sum').innerHTML=KEYS.map(k=>`<span class="chip ${k}"><b>${n[k]}</b> ${esc(L[k])}</span>`).join('')+`<span class="chip"><b>${n.U}</b> Unmarked</span>`;$('#pg').style.width=(c.students.length?100-n.U/c.students.length*100:0)+'%';
const rows=c.students.filter(s=>(!df||(s.dept||c.dept)===df)&&(!qq||(s.name+' '+s.roll+' '+(s.dept||c.dept||'')).toLowerCase().includes(qq)));
$('#list').innerHTML=rows.length?rows.map(s=>`<div class="row" data-id="${s.id}">${who(s,c)}<div class="st">${KEYS.map(k=>`<button class="${k}" data-act="mark" data-k="${k}" aria-pressed="${day[s.id]===k}">${esc(L[k])}</button>`).join('')}</div></div>`).join(''):`<p class="muted pad">${c.students.length?'No students match your search.':'No students yet. Add them in the Students tab.'}</p>`}
function vStu(){const c=C();if(!c)return empty('No classes yet');return `<section><h2>Students</h2><div class="card bar">${pick()}<div class="acts"><button class="btn" data-act="editClass">Edit class</button><button class="btn" data-act="newClass">New class</button><button class="btn dng" data-act="delClass">Delete</button></div></div>
<form class="card add" id="addS"><input name="roll" placeholder="Roll no." aria-label="Roll number" required><input name="name" placeholder="Student name" aria-label="Student name" required><select name="dept" aria-label="Department">${dOpts('','Class default'+(c.dept?' ('+esc(c.dept)+')':''))}</select><button class="btn pri">Add student</button></form>
<div class="tools"><button class="btn" data-act="paste">Paste a list</button><button class="btn" data-act="impStu">Import CSV</button></div>${slider(c)||'<p class="muted">Add departments in the Departments tab to tag and filter students.</p>'}
<div class="card list">${c.students.length?c.students.filter(s=>!df||(s.dept||c.dept)===df).map(s=>`<div class="row" data-id="${s.id}">${who(s,c)}<div class="acts"><button class="btn" data-act="editS">Edit</button><button class="btn dng" data-act="delS">Remove</button></div></div>`).join('')||'<p class="muted pad">No students in this department.</p>':'<p class="muted pad">Add your first student above, or paste a list.</p>'}</div><p class="muted">${c.students.filter(s=>!df||(s.dept||c.dept)===df).length} of ${c.students.length} students shown</p></section>`}
function vRep(){const c=C();if(!c)return empty('No data yet');const r=stats(c,rf,rt),m=S.settings.min,L=S.settings.labels,rows=r.rows.filter(x=>!df||(x.s.dept||c.dept)===df);
rows.sort(sort==='pct'?(a,b)=>(a.pct==null?101:a.pct)-(b.pct==null?101:b.pct):sort==='name'?(a,b)=>a.s.name.localeCompare(b.s.name):(a,b)=>byRoll(a.s,b.s));
const have=rows.filter(x=>x.pct!==null),avg=have.length?(have.reduce((t,x)=>t+x.pct,0)/have.length).toFixed(1)+'%':'–',low=have.filter(x=>x.pct<m).length;
return `<section><h2>Reports</h2><div class="card bar">${pick()}<label>From<input type="date" id="rf" value="${rf}"></label><label>To<input type="date" id="rt" value="${rt}"></label><label>Sort by<select id="sort">${[['roll','Roll no.'],['name','Name'],['pct','Lowest attendance']].map(o=>`<option value="${o[0]}"${sort===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></label></div>
${slider(c)}<div class="sum"><span class="chip"><b>${r.dates.length}</b> days recorded</span><span class="chip"><b>${avg}</b> average</span><span class="chip A"><b>${low}</b> below ${m}%</span></div>
<div class="tools"><button class="btn pri" data-act="expRep">Export CSV</button><button class="btn" data-act="print">Print</button></div>
<div class="card tw"><table><thead><tr><th>Roll</th><th>Name</th>${KEYS.map(k=>`<th title="${esc(L[k])}">${esc(L[k].charAt(0)||k)}</th>`).join('')}<th>Attendance</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.s.roll)}</td><td>${esc(x.s.name)}${(x.s.dept||c.dept)?'<div class="muted" style="margin:0;font-size:.75rem">'+esc(x.s.dept||c.dept)+'</div>':''}</td>${KEYS.map(k=>`<td>${x.n[k]}</td>`).join('')}<td class="pct${x.pct!==null&&x.pct<m?' low':''}">${x.pct===null?'–':x.pct+'%'}<div class="meter"><i style="width:${x.pct||0}%"></i></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No students yet.</td></tr>'}</tbody></table></div><p class="muted">Late counts as present: ${S.settings.late?'yes':'no'}. Leave is not counted in the percentage.</p></section>`}
function vSet(){const s=S.settings,f=(k,l)=>`<label>${l}<input data-set="${k}" value="${esc(s[k])}"></label>`;
return `<section><h2>Settings</h2><div class="card form"><h3>Institution</h3>${f('college','College name')}${f('tagline','Sheet title')}<label>Default department for new classes<select data-set="dept">${dOpts(s.dept)}</select></label></div>
<div class="card form"><h3>Appearance</h3><label>Theme<select data-set="theme">${['auto','light','dark'].map(t=>`<option value="${t}"${s.theme===t?' selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></label><label>Accent colour<input type="color" data-set="accent" value="${s.accent}"></label><label>Text size: ${s.size}%<input type="range" min="85" max="125" step="5" data-set="size" value="${s.size}"></label></div>
<div class="card form"><h3>Attendance rules</h3><label>Minimum attendance (%)<input type="number" min="0" max="100" data-set="min" value="${s.min}"></label><label class="chk"><input type="checkbox" data-set="late"${s.late?' checked':''}> Count Late as present</label>${KEYS.map(k=>`<label>Name for “${DEF.settings.labels[k]}”<input data-lab="${k}" value="${esc(s.labels[k])}"></label>`).join('')}</div>
<div class="card form"><h3>Your data</h3><p class="muted">Everything is saved in this browser only. Export a backup regularly, and before clearing browser data.</p><div class="acts"><button class="btn pri" data-act="expJson">Export backup</button><button class="btn" data-act="impJson">Import backup</button><button class="btn" data-act="expCsv">Export class CSV</button><button class="btn dng" data-act="reset">Reset all data</button></div></div></section>`}
function vDep(){const cnt=d=>[S.classes.filter(c=>c.dept===d).length,S.classes.reduce((t,c)=>t+c.students.filter(s=>(s.dept||c.dept)===d).length,0)];
return `<section><h2>Departments</h2><p class="muted">Create your departments once, then pick them for classes and students.</p><form class="card add2" id="addD"><input name="d" placeholder="Department name, e.g. Computer Science and Engineering" aria-label="Department name" required><button class="btn pri">Add department</button></form><div class="card list">${S.depts.length?S.depts.map(d=>{const n=cnt(d);return `<div class="row" data-dep="${esc(d)}"><div class="who"><span class="av" style="background:hsl(${hue(d)} 55% 46%)">${esc(ini(d))}</span><span class="nm">${esc(d)}<small>${n[0]} classes – ${n[1]} students</small></span></div><div class="acts"><button class="btn" data-act="editD">Rename</button><button class="btn dng" data-act="delD">Delete</button></div></div>`}).join(''):'<p class="muted pad">No departments yet. Add your first one above.</p>'}</div></section>`}
function vRoutine(){const c=C();if(!c)return empty('Class routine');const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const items=[...(c.routine||[])].sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||a.start.localeCompare(b.start));return `<section><h2>Class routine</h2><p class="muted">Organize weekly class times, subjects, teachers and rooms.</p><div class="card bar">${pick()}<button class="btn pri" data-act="addRoutine">Add routine entry</button></div><div class="card list">${items.length?items.map(x=>`<div class="row" data-rid="${esc(x.id)}"><div class="who"><span class="av" style="background:hsl(${hue(x.day)} 55% 46%)">${esc(x.day.slice(0,2).toUpperCase())}</span><span class="nm">${esc(x.subject)}<small>${esc(x.day)} · ${esc(x.start)}–${esc(x.end)}${x.room?' · '+esc(x.room):''}${x.teacher?' · '+esc(x.teacher):''}</small></span></div><div class="acts"><button class="btn" data-act="editRoutine">Edit</button><button class="btn dng" data-act="delRoutine">Remove</button></div></div>`).join(''):'<p class="muted pad">No routine entries yet. Add the weekly class schedule above.</p>'}</div></section>`}
const V={attendance:vAtt,students:vStu,routine:vRoutine,departments:vDep,reports:vRep,settings:vSet};
function render(){skin();$('#deps').innerHTML=[...new Set([S.settings.dept,...S.classes.flatMap(c=>[c.dept,...c.students.map(s=>s.dept)])].filter(Boolean))].map(d=>`<option value="${esc(d)}">`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===view?'page':'false'));$('#view').innerHTML=V[view]();if(view==='attendance'&&C())list()}
function addS(c,arr){let n=0;arr.forEach(s=>{const roll=s.roll||String(c.students.length+1);if(!c.students.some(x=>x.roll===roll)){c.students.push({id:uid(),roll,name:s.name,dept:s.dept||''});n++}});c.students.sort(byRoll);save();render();return n}
function parseS(t){return t.split(/\r?\n/).map(l=>l.replace(/"/g,'').split(/[,\t;]/).map(x=>x.trim())).filter(p=>p.join('')).map(p=>p.length>1?{roll:p[0],name:p[1],dept:p[2]||''}:{roll:'',name:p[0],dept:''}).filter(s=>s.name&&!/^roll/i.test(s.roll))}
const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';
function csv(c,from,to,dep){const r=stats(c,from,to),L=S.settings.labels;return '\ufeff'+[['Roll no','Name','Department',...r.dates,L.P,L.A,L.L,L.E,'Attendance %'],...r.rows.filter(x=>!dep||(x.s.dept||c.dept)===dep).map(x=>[x.s.roll,x.s.name,x.s.dept||c.dept||'',...r.dates.map(d=>L[c.records[d][x.s.id]]||''),x.n.P,x.n.A,x.n.L,x.n.E,x.pct===null?'':x.pct])].map(l=>l.map(cell).join(',')).join('\r\n')}
async function dl(name,text,mime){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:text});toast('Saved '+name);return}}catch(e){if(e&&e.code==='declined')return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.append(a);a.click();a.remove();toast('Downloaded '+name)}
function pickFile(acc,fn){const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=async()=>{if(i.files[0])fn(await i.files[0].text())};i.click()}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'class';
const A={
theme(){const o=['auto','light','dark'],s=S.settings;s.theme=o[(o.indexOf(s.theme)+1)%3];save();skin();toast('Theme: '+s.theme)},
day(b){const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+Number(b.dataset.d));date=iso(d);render()},
mark(b,id){const c=C(),d=c.records[date]=c.records[date]||{},k=b.dataset.k;d[id]===k?delete d[id]:d[id]=k;if(!Object.keys(d).length)delete c.records[date];save();list()},
all(){const c=C(),d=c.records[date]=c.records[date]||{};c.students.filter(s=>!df||(s.dept||c.dept)===df).forEach(s=>d[s.id]='P');save();list();toast('Everyone marked '+S.settings.labels.P)},
clear(){sheet({title:'Clear this day?',msg:'All marks for '+esc(fmt(date))+' will be removed.',ok:'Clear',danger:1,run(){delete C().records[date];save();list()}})},
close,
newClass(){sheet({title:'New class',fields:[{k:'name',l:'Class name',ph:'e.g. B.Tech CSE Sem 3',req:1},{k:'dept',l:'Department',v:S.settings.dept,ph:'e.g. Computer Science and Engineering',dl:1},{k:'sub',l:'Subject or section (optional)',ph:'e.g. Data Structures'},{k:'teacher',l:'Teacher name',ph:'Teacher responsible for this class'}],run(d){const c={id:uid(),name:d.name.trim(),sub:d.sub.trim(),dept:d.dept.trim(),teacher:d.teacher.trim(),routine:[],students:[],records:{}};S.classes.push(c);S.active=c.id;save();render();toast('Class created')}})},
editClass(){const c=C();sheet({title:'Edit class',fields:[{k:'name',l:'Class name',v:c.name,req:1},{k:'dept',l:'Department',v:c.dept,dl:1},{k:'sub',l:'Subject or section',v:c.sub},{k:'teacher',l:'Teacher name',v:c.teacher||''}],run(d){c.name=d.name.trim();c.dept=d.dept.trim();c.sub=d.sub.trim();c.teacher=d.teacher.trim();save();render()}})},
addRoutine(){const c=C();if(!c)return;sheet({title:'Add routine entry',fields:[{k:'day',l:'Day',options:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],v:'Monday'},{k:'start',l:'Start time',type:'time',req:1},{k:'end',l:'End time',type:'time',req:1},{k:'subject',l:'Subject',req:1},{k:'teacher',l:'Teacher name',v:c.teacher||''},{k:'room',l:'Room or venue'}],ok:'Add to routine',run(d){c.routine=c.routine||[];c.routine.push({id:uid(),...d});save();render()}})},
editRoutine(b){const c=C(),x=c.routine.find(r=>r.id===b.closest('[data-rid]').dataset.rid);sheet({title:'Edit routine entry',fields:[{k:'day',l:'Day',options:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],v:x.day},{k:'start',l:'Start time',type:'time',v:x.start,req:1},{k:'end',l:'End time',type:'time',v:x.end,req:1},{k:'subject',l:'Subject',v:x.subject,req:1},{k:'teacher',l:'Teacher name',v:x.teacher||''},{k:'room',l:'Room or venue',v:x.room||''}],run(d){Object.assign(x,d);save();render()}})},
delRoutine(b){const c=C(),id=b.closest('[data-rid]').dataset.rid;c.routine=c.routine.filter(r=>r.id!==id);save();render()},
delClass(){const c=C();sheet({title:'Delete class?',msg:'<b>'+esc(c.name)+'</b> with all its students and attendance records will be deleted. This can’t be undone.',ok:'Delete',danger:1,run(){S.classes=S.classes.filter(x=>x.id!==c.id);S.active='';save();render()}})},
editS(b,id){const c=C(),s=c.students.find(x=>x.id===id);sheet({title:'Edit student',fields:[{k:'roll',l:'Roll no.',v:s.roll,req:1},{k:'name',l:'Name',v:s.name,req:1},{k:'dept',l:'Department',v:s.dept,dl:1,none:'Same as class'}],run(d){s.roll=d.roll.trim();s.name=d.name.trim();s.dept=d.dept.trim();c.students.sort(byRoll);save();render()}})},
delS(b,id){const c=C(),s=c.students.find(x=>x.id===id);sheet({title:'Remove student?',msg:esc(s.name)+' and their attendance will be deleted.',ok:'Remove',danger:1,run(){c.students=c.students.filter(x=>x.id!==id);Object.values(c.records).forEach(r=>delete r[id]);save();render()}})},
paste(){sheet({title:'Paste a list',msg:'One student per line: roll no., name, department (optional). Copy straight from Excel or Google Sheets.',fields:[{k:'t',l:'Students',area:1,ph:'101, Aman Kumar, CSE\n102, Priya Singh, CSE'}],ok:'Add students',run(d){toast(addS(C(),parseS(d.t))+' students added')}})},
impStu(){pickFile('.csv,.txt,text/csv',t=>toast(addS(C(),parseS(t))+' students imported'))},
expRep(){const c=C();dl('attendance-'+slug(c.name)+'-'+iso(new Date())+'.csv',csv(c,rf,rt,df),'text/csv')},
expCsv(){const c=C();c?dl('attendance-'+slug(c.name)+'-'+iso(new Date())+'.csv',csv(c),'text/csv'):toast('Create a class first')},
expJson(){dl('attendance-backup-'+iso(new Date())+'.json',JSON.stringify(S,null,2),'application/json')},
impJson(){pickFile('.json,application/json',t=>{try{const r=JSON.parse(t);if(!Array.isArray(r.classes))throw 0;sheet({title:'Replace all data?',msg:'This backup has '+r.classes.length+' class(es). Your current data will be replaced.',ok:'Import',danger:1,run(){S=norm(r);save();render();toast('Backup imported')}})}catch(e){toast('That file isn’t a valid attendance backup')}})},
reset(){sheet({title:'Reset all data?',msg:'All classes, students, records and settings will be erased from this browser. Export a backup first if you need one.',ok:'Erase everything',danger:1,run(){S=norm(null);save();render()}})},
editD(b){const o=b.closest('[data-dep]').dataset.dep;sheet({title:'Rename department',fields:[{k:'d',l:'Department name',v:o,req:1}],run(x){const n=x.d.trim();if(!n||n===o)return;if(S.depts.some(y=>y!==o&&y.toLowerCase()===n.toLowerCase()))return toast('That department already exists');S.depts=S.depts.map(y=>y===o?n:y).sort((a,b)=>a.localeCompare(b));S.classes.forEach(c=>{if(c.dept===o)c.dept=n;c.students.forEach(s=>{if(s.dept===o)s.dept=n})});if(S.settings.dept===o)S.settings.dept=n;if(df===o)df=n;save();render()}})},
delD(b){const o=b.closest('[data-dep]').dataset.dep;sheet({title:'Delete department?',msg:'<b>'+esc(o)+'</b> will be removed from the list and cleared from every class and student that uses it. Attendance records are not affected.',ok:'Delete',danger:1,run(){S.depts=S.depts.filter(y=>y!==o);S.classes.forEach(c=>{if(c.dept===o)c.dept='';c.students.forEach(s=>{if(s.dept===o)s.dept=''})});if(S.settings.dept===o)S.settings.dept='';if(df===o)df='';save();render()}})},
filt(b){df=b.dataset.dep;render()},
print(){try{window.print()}catch(e){toast('Printing isn’t available here')}}};
document.addEventListener('click',e=>{if(e.target.id==='ov')return close();const b=e.target.closest('[data-act],[data-v]');if(!b)return;if(b.dataset.v){view=b.dataset.v;render();scrollTo(0,0);return}
const r=b.closest('[data-id]');A[b.dataset.act]&&A[b.dataset.act](b,r&&r.dataset.id)});
document.addEventListener('change',e=>{const t=e.target,s=S.settings;
if(t.dataset.ch){S.active=t.value;save();render()}
else if(t.id==='date'){date=t.value||date;render()}
else if(t.id==='rf'||t.id==='rt'||t.id==='sort'){t.id==='rf'?rf=t.value:t.id==='rt'?rt=t.value:sort=t.value;render()}
else if(t.dataset.set){const k=t.dataset.set;s[k]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.type==='number'?Math.min(100,Math.max(0,+t.value||0)):t.value;save();skin();if(t.type==='range'||t.type==='number')render()}
else if(t.dataset.lab){s.labels[t.dataset.lab]=t.value.trim()||DEF.settings.labels[t.dataset.lab];save();t.value=s.labels[t.dataset.lab]}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;list()}});
document.addEventListener('submit',e=>{if(e.target.id!=='addS')return;e.preventDefault();const f=e.target,c=C(),r=f.roll.value.trim(),n=f.name.value.trim();if(!r||!n)return;if(c.students.some(s=>s.roll===r))return toast('Roll no. '+r+' already exists');addS(c,[{roll:r,name:n,dept:f.dept.value.trim()}]);$('#addS [name=roll]').focus()});
document.addEventListener('submit',e=>{if(e.target.id!=='addD')return;e.preventDefault();const v=e.target.d.value.trim();if(!v)return;if(S.depts.some(x=>x.toLowerCase()===v.toLowerCase()))return toast('That department already exists');S.depts.push(v);S.depts.sort((a,b)=>a.localeCompare(b));save();render();$('#addD [name=d]').focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function setupCollege(){if(S.settings.college)return;sheet({title:'Welcome — set up your college',msg:'Enter the college name to personalize the attendance sheet. You can change it later in Settings.',fields:[{k:'college',l:'College name',ph:'e.g. IMPACT College of Engineering and Management',req:1}],ok:'Continue',run(d){S.settings.college=d.college.trim();save();render()}})}
function syncDay(){clearTimeout(midnightTimer);const now=new Date(),today=iso(now);if(today!==lastToday){if(date===lastToday)date=today;lastToday=today;if(view==='attendance')render()}const next=new Date(now);next.setHours(24,0,0,50);midnightTimer=setTimeout(syncDay,Math.max(1000,next-now))}
window.addEventListener('focus',syncDay);
render();setupCollege();syncDay();
</script>
</body>
</html>
