<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1757b7">
  <title>Offline · Edutrack</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172338;background:#f3f6fb;color-scheme:light}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:32px;border:1px solid #dfe6f0;border-radius:24px;background:#fff;box-shadow:0 18px 48px #122b4a12;text-align:center}.mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 20px;border-radius:17px;background:#1757b7;color:#fff;font-size:1.5rem;font-weight:750}.eyebrow{color:#1757b7;font-size:.74rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{margin:8px 0;font-size:1.8rem;letter-spacing:-.04em}p{color:#5c6c81;line-height:1.6}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:10px;padding:0 18px;border:0;border-radius:12px;background:#1757b7;color:#fff;font:inherit;font-weight:650;text-decoration:none}:focus-visible{outline:3px solid #76aaff;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">E</div>
    <p class="eyebrow">Edutrack</p>
    <h1>You’re offline</h1>
    <p>Connect to the internet to sign in and view the latest attendance and academic information. Edutrack does not store private account or student data for offline use.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
