<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#007aff">
  <meta name="description" content="Edutrack college attendance and academic management">
  <title>Edutrack — College Attendance</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Edutrack home"><span class="brand-mark">🎓</span><span><b>Edutrack</b><small>College attendance</small></span></a>
    <div class="top-actions"><span id="identity" class="identity" hidden></span><button id="logout" class="button quiet" hidden>Log out</button><button id="theme-toggle" class="icon-button" aria-label="Toggle theme">◐</button></div>
  </header>
  <main id="app" class="page" aria-live="polite"><div class="loading"><span class="spinner"></span><span>Loading Edutrack…</span></div></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
</body>
</html>
