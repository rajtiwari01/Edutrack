<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1757b7">
  <meta name="description" content="Edutrack college attendance and academic management">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Edutrack">
  <meta property="og:title" content="Edutrack — College Attendance">
  <meta property="og:description" content="Secure college attendance and academic management for students, teachers, owners, and moderators.">
  <meta name="twitter:card" content="summary">
  <meta name="application-name" content="Edutrack">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Edutrack">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/edutrack-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/edutrack-icon-192.png" sizes="192x192">
  <title>Edutrack — College Attendance</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
  <script src="/notifications.js" defer></script>
  <script src="/pwa.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Edutrack home"><span class="brand-mark" aria-hidden="true">E</span><span class="brand-copy"><b>Edutrack</b><small id="college-name">College academic platform</small></span></a>
    <div class="top-actions">
      <div class="notification-shell">
        <button id="notification-button" class="icon-button notification-button" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notification-panel" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span id="notification-count" class="notification-count" hidden></span>
        </button>
        <section id="notification-panel" class="notification-panel" aria-labelledby="notification-title" hidden>
          <div class="notification-heading"><div><p class="eyebrow">Edutrack updates</p><h2 id="notification-title">Notifications</h2></div><button id="notification-close" class="icon-button" type="button" aria-label="Close notifications">×</button></div>
          <div id="notification-list" class="notification-list"><p class="empty">You’re all caught up.</p></div>
          <button id="notification-mark-read" class="button quiet notification-mark-read" type="button" hidden>Mark all as read</button>
          <button id="notification-enable" class="button soft notification-enable" type="button" hidden>Enable browser notifications</button>
          <p id="notification-permission-note" class="notification-permission-note" aria-live="polite"></p>
        </section>
      </div>
      <button id="install-app" class="button soft install-button" type="button" aria-label="Install Edutrack">Install</button>
      <span id="identity" class="identity" hidden></span>
      <button id="logout" class="button quiet logout-button" aria-label="Log out" hidden><svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg><span class="logout-label">Log out</span></button>
      <button id="theme-toggle" class="icon-button" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <main id="app" class="page" aria-live="polite"><div class="loading"><span class="spinner"></span><span>Loading Edutrack…</span></div></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <dialog id="install-dialog" class="dialog install-dialog" aria-labelledby="install-dialog-title"></dialog>
</body>
</html>
